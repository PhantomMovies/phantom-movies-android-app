name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: PhantomMovies/phantom-movies-app
          token: ${{ secrets.APP_REPO_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build sideload release APK
        run: |
          ./gradlew assembleSideloadRelease --console=plain --no-daemon \
            -PPHANTOM_UPDATE_MANIFEST_URL=https://raw.githubusercontent.com/PhantomMovies/phantom-movies-android-app/main/app-release.json \
            -PPHANTOM_BETA_UPDATE_MANIFEST_URL=https://raw.githubusercontent.com/PhantomMovies/phantom-movies-android-app/main/app-release-beta.json

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk "release/phantom-movies-${{ steps.release_tag.outputs.tag }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Phantom Movies ${{ steps.release_tag.outputs.tag }}
          files: release/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-beta') || contains(steps.release_tag.outputs.tag, '-dev') }}
