name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify APK
        run: test -f "releases/${{ steps.release_tag.outputs.tag }}/phantom-movies-${{ steps.release_tag.outputs.tag }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Phantom Movies ${{ steps.release_tag.outputs.tag }}
          files: releases/${{ steps.release_tag.outputs.tag }}/phantom-movies-${{ steps.release_tag.outputs.tag }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-beta') || contains(steps.release_tag.outputs.tag, '-dev') }}

      - name: Authenticate Firebase
        id: firebase_auth
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Send update push notification
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          tag = os.environ["RELEASE_TAG"]
          prerelease = "-beta" in tag or "-dev" in tag
          manifest_path = "app-release-beta.json" if prerelease else "app-release.json"
          topic = "phantom_app_beta_updates" if prerelease else "phantom_app_updates"

          with open(manifest_path, "r", encoding="utf-8") as file:
              manifest = json.load(file)

          data = {
              "type": "app_update",
              "versionCode": str(manifest.get("versionCode", "")),
              "version": str(manifest.get("version", "")),
              "versionName": str(manifest.get("version", "")),
              "download_url": str(manifest.get("download_url", "")),
              "play_url": str(manifest.get("play_url", "")),
              "description": str(manifest.get("body", "")),
          }
          payload = {
              "message": {
                  "topic": topic,
                  "data": data,
                  "android": {
                      "priority": "high"
                  }
              }
          }

          request = urllib.request.Request(
              "https://fcm.googleapis.com/v1/projects/phantom-movies/messages:send",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["ACCESS_TOKEN"],
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode("utf-8"))
          PY

      - name: Skip push notification
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured; GitHub release was published without sending a push notification."
